<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Long Video Recorder (OLED Saver & 0.5x Support)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* กล่องแสดงผลกล้อง */
    .preview-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* แผงควบคุมด้านล่าง */
    .controls {
      height: 160px;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 10px 20px;
      z-index: 10;
    }

    .status-bar {
      display: flex;
      gap: 15px;
      font-size: 14px;
      color: #aaa;
    }

    .recording-time {
      color: #ff3b30;
      font-weight: bold;
      display: none;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
      align-items: center;
    }

    button {
      background: #2c2c2e;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* ปุ่มอัดวิดีโอ */
    #recordBtn {
      background: #ff3b30;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #fff;
    }

    #recordBtn.recording {
      background: #fff;
      border-color: #ff3b30;
    }

    #recordBtn.recording::after {
      content: "";
      width: 24px;
      height: 24px;
      background: #ff3b30;
      border-radius: 4px;
    }

    /* ตัวเลือกกล้อง */
    select {
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 14px;
      max-width: 150px;
    }

    /* Overlay จอมืดสนิทสำหรับจอ OLED */
    #blackScreenOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 99999;
      display: none;
      cursor: pointer;
    }

    .overlay-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #111; /* สีสลัวมาก ป้องกันแสงสะท้อน */
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- กล่องพรีวิวกล้อง -->
  <div class="preview-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <!-- แผงปุ่มควบคุม -->
  <div class="controls">
    <div class="status-bar">
      <span id="statusText">เตรียมพร้อม</span>
      <span id="timeDisplay" class="recording-time">00:00:00</span>
    </div>

    <div class="btn-group">
      <!-- ตัวเลือกรายการกล้องในเครื่อง -->
      <select id="cameraSelect" onchange="switchCamera(this.value)">
        <option value="">กำลังค้นหากล้อง...</option>
      </select>

      <!-- ปุ่มอัดวิดีโอ -->
      <button id="recordBtn" onclick="toggleRecording()"></button>

      <!-- ปุ่มดับจอประหยัดพลังงาน -->
      <button id="blackScreenBtn" onclick="enableBlackScreen()" style="background: #000; border: 1px solid #555;">
        🌙 ดับจอ
      </button>
    </div>
  </div>

  <!-- หน้าจอมืดสนิท (OLED Black Overlay) -->
  <div id="blackScreenOverlay" onclick="disableBlackScreen()">
    <div class="overlay-hint">แตะหน้าจอ 1 ครั้งเพื่อเลิกดับจอ</div>
  </div>

  <script>
    let currentStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordInterval = null;
    let startTime = 0;
    let wakeLock = null;

    const webcam = document.getElementById('webcam');
    const cameraSelect = document.getElementById('cameraSelect');
    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('statusText');
    const timeDisplay = document.getElementById('timeDisplay');
    const blackOverlay = document.getElementById('blackScreenOverlay');

    // 1. เริ่มต้นค้นหากล้องและเรียกใช้งาน
    async function initCamera() {
      try {
        const initialStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        initialStream.getTracks().forEach(track => track.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        
        let ultrawideId = null;

        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          
          let label = device.label || `Camera ${index + 1}`;
          
          if (label.toLowerCase().includes('ultra') || label.toLowerCase().includes('wide') || label.includes('0.5')) {
            label = `🔍 0.5x Ultrawide`;
            ultrawideId = device.deviceId;
          }

          option.text = label;
          cameraSelect.appendChild(option);
        });

        const selectedId = ultrawideId || (videoDevices[0] ? videoDevices[0].deviceId : null);
        if (selectedId) {
          cameraSelect.value = selectedId;
          await startStream(selectedId);
        }

      } catch (err) {
        alert('ไม่สามารถเข้าถึงกล้อง/ไมโครโฟนได้: ' + err.message);
      }
    }

    // 2. เปิดใช้งาน Stream กล้อง
    async function startStream(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          deviceId: { exact: deviceId },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: true
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcam.srcObject = currentStream;
      } catch (err) {
        console.error(" Error loading camera stream: ", err);
        currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        webcam.srcObject = currentStream;
      }
    }

    async function switchCamera(deviceId) {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        alert('กรุณาหยุดบันทึกวิดีโอก่อนเปลี่ยนกล้อง');
        return;
      }
      await startStream(deviceId);
    }

    // 3. ระบบอัดวิดีโอ (MediaRecorder API) ที่แก้ไขเรื่องการโหลดแล้ว
    function toggleRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        startRecording();
      } else {
        stopRecording();
      }
    }

    // ดึง MIME Type ที่ดีที่สุดสำหรับอุปกรณ์ (iOS ใช้ mp4, Android/PC ใช้ webm)
    function getSupportedMimeType() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm'
      ];
      return types.find(type => MediaRecorder.isTypeSupported(type)) || '';
    }

    async function startRecording() {
      recordedChunks = [];
      const selectedMime = getSupportedMimeType();

      try {
        mediaRecorder = new MediaRecorder(currentStream, { mimeType: selectedMime });
      } catch (e) {
        mediaRecorder = new MediaRecorder(currentStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      // เรียกฟังก์ชันแชร์/โหลดเมื่อกดหยุด
      mediaRecorder.onstop = showVideoPreview; 

      mediaRecorder.start(1000); // เก็บข้อมูลทุกๆ 1 วินาที
      requestWakeLock();

      recordBtn.classList.add('recording');
      statusText.innerText = "กำลังบันทึก...";
      timeDisplay.style.display = "inline";
      
      startTime = Date.now();
      recordInterval = setInterval(updateTimer, 1000);
    }

    function stopRecording() {
      mediaRecorder.stop();
      clearInterval(recordInterval);
      releaseWakeLock();

      recordBtn.classList.remove('recording');
      statusText.innerText = "กำลังประมวลผล...";
      timeDisplay.style.display = "none";
      timeDisplay.innerText = "00:00:00";
      
      setTimeout(() => {
          statusText.innerText = "เตรียมพร้อม";
      }, 2000);
    }

    // 4. ระบบบันทึก/แชร์ไฟล์ (แก้ไขให้รองรับมือถือ)
    async function showVideoPreview() {
      const mimeType = mediaRecorder.mimeType || 'video/mp4';
      const blob = new Blob(recordedChunks, { type: mimeType });
      const videoUrl = URL.createObjectURL(blob);
      
      // กำหนดนามสกุลไฟล์ให้ตรงกับ MIME Type
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const fileName = `video_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.${ext}`;

      // หากเป็นมือถือและรองรับ Web Share API (บันทึกลง Photos ได้โดยตรง)
      const file = new File([blob], fileName, { type: mimeType });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'บันทึกวิดีโอ',
            text: 'วิดีโอจาก Long Recorder'
          });
          return; // แชร์สำเร็จ ไม่ต้องดาวน์โหลดซ้ำ
        } catch (err) {
          console.log('User cancelled share or share failed:', err);
        }
      }

      // หากไม่รองรับ Share ให้ใช้วิธีเปิดลิงก์ดาวน์โหลดตรงๆ
      const a = document.createElement('a');
      a.href = videoUrl;
      a.download = fileName;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(videoUrl);
      }, 100);
    }

    // 5. ตัวนับเวลาการอัดคลิป
    function updateTimer() {
      const elapsedMs = Date.now() - startTime;
      const totalSec = Math.floor(elapsedMs / 1000);
      const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      timeDisplay.innerText = `${hrs}:${mins}:${secs}`;
    }

    // 6. ระบบจอมืดสนิท (OLED Saver)
    function enableBlackScreen() {
      blackOverlay.style.display = 'block';
    }

    function disableBlackScreen() {
      blackOverlay.style.display = 'none';
    }

    // 7. Screen Wake Lock API ป้องกันเครื่อง Sleep
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock Error:', err.message);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    // เรียกทำงานเมื่อโหลดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
</html>
