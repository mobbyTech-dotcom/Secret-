<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Universal Long Video Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* กล่องพรีวิว */
    .preview-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* แผงควบคุม */
    .controls {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .status-bar {
      display: flex;
      gap: 15px;
      font-size: 14px;
      color: #aaa;
    }

    .recording-time {
      color: #ff3b30;
      font-weight: bold;
      display: none;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    button, .native-btn {
      background: #2c2c2e;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:active, .native-btn:active {
      opacity: 0.7;
    }

    /* ปุ่มอัดหลัก */
    #recordBtn {
      background: #ff3b30;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      padding: 0;
      border: 4px solid #fff;
    }

    #recordBtn.recording {
      background: #fff;
      border-color: #ff3b30;
    }

    #recordBtn.recording::after {
      content: "";
      width: 20px;
      height: 20px;
      background: #ff3b30;
      border-radius: 4px;
    }

    select {
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      max-width: 140px;
    }

    #nativeFileInput {
      display: none;
    }

    .legacy-notice {
      background: #332200;
      color: #ffcc00;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 5px;
      display: none;
    }

    /* Overlay จอมืดสนิท */
    #blackScreenOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .overlay-hint {
      color: #222; /* สีสลัวมืด ประหยัดไฟและไม่แสบตา */
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      transition: color 0.3s;
    }
  </style>
</head>
<body>

  <div class="preview-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <div id="legacyNotice" class="legacy-notice">
      ⚠️ โหมด iOS 12 / เครื่องรุ่นเก่า: ใช้ปุ่มถ่ายด้วยกล้องระบบ
    </div>

    <div class="status-bar">
      <span id="statusText">กำลังเตรียมระบบ...</span>
      <span id="timeDisplay" class="recording-time">00:00:00</span>
    </div>

    <div class="btn-group">
      <select id="cameraSelect" onchange="switchCamera(this.value)">
        <option value="">กล้องหลังปกติ</option>
      </select>

      <button id="recordBtn" onclick="toggleRecording()"></button>

      <label for="nativeFileInput" id="nativeRecordBtn" class="native-btn" style="display: none; background: #007aff;">
        📷 ถ่ายวิดีโอ (กล้องระบบ)
      </label>
      <input type="file" id="nativeFileInput" accept="video/*" capture="environment" onchange="handleNativeVideo(this)">

      <button onclick="enableBlackScreen()" style="background: #1c1c1e; border: 1px solid #444;">
        🌙 ดับจอ
      </button>
    </div>
  </div>

  <!-- หน้าจอมืดสนิท (แตะค้าง 3 วิเพื่อปลดล็อก) -->
  <div id="blackScreenOverlay" 
       ontouchstart="startHold(event)" 
       ontouchend="cancelHold()" 
       ontouchcancel="cancelHold()" 
       onmousedown="startHold(event)" 
       onmouseup="cancelHold()" 
       onmouseleave="cancelHold()">
    <div class="overlay-hint" id="overlayHint">แตะหน้าจอค้างไว้ 3 วินาที เพื่อเปิดหน้าจอ</div>
  </div>

  <script>
    let currentStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordInterval = null;
    let startTime = 0;
    let wakeLock = null;
    let holdTimer = null; // ตัวจับเวลาการแตะค้าง

    const webcam = document.getElementById('webcam');
    const cameraSelect = document.getElementById('cameraSelect');
    const recordBtn = document.getElementById('recordBtn');
    const nativeRecordBtn = document.getElementById('nativeRecordBtn');
    const legacyNotice = document.getElementById('legacyNotice');
    const statusText = document.getElementById('statusText');
    const timeDisplay = document.getElementById('timeDisplay');
    const blackOverlay = document.getElementById('blackScreenOverlay');
    const overlayHint = document.getElementById('overlayHint');

    const isMediaRecorderSupported = !!(window.MediaRecorder);

    async function initApp() {
      if (!isMediaRecorderSupported) {
        statusText.innerText = "โหมดเครื่องรุ่นเก่า (iOS 12)";
        legacyNotice.style.display = "block";
        recordBtn.style.display = "none";
        nativeRecordBtn.style.display = "inline-flex";
      } else {
        statusText.innerText = "เตรียมพร้อม";
      }
      await setupCamera();
    }

    async function setupCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusText.innerText = "เบราว์เซอร์ไม่รองรับการเปิดกล้อง";
        return;
      }

      try {
        if (navigator.mediaDevices.enumerateDevices) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');
          
          if (videoDevices.length > 0) {
            cameraSelect.innerHTML = '';
            let selectedId = null;

            videoDevices.forEach((device, index) => {
              const option = document.createElement('option');
              option.value = device.deviceId;
              let label = device.label || `Camera ${index + 1}`;
              
              if (label.toLowerCase().includes('ultra') || label.toLowerCase().includes('0.5')) {
                label = "🔍 0.5x Ultrawide";
                selectedId = device.deviceId;
              }
              option.text = label;
              cameraSelect.appendChild(option);
            });

            if (selectedId) cameraSelect.value = selectedId;
          }
        }
        await startStream(cameraSelect.value || null);
      } catch (err) {
        startStream(null);
      }
    }

    async function startStream(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: "environment" } },
        audio: true
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcam.srcObject = currentStream;
      } catch (err) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
          webcam.srcObject = currentStream;
        } catch (e) {
          statusText.innerText = "ไม่สามารถเปิดกล้องได้";
        }
      }
    }

    async function switchCamera(deviceId) {
      if (mediaRecorder && mediaRecorder.state === 'recording') return;
      await startStream(deviceId);
    }

    function toggleRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      if (!currentStream) return;
      recordedChunks = [];
      
      try {
        mediaRecorder = new MediaRecorder(currentStream);
      } catch (e) {
        alert("เครื่องนี้ไม่รองรับการบันทึกวิดีโอผ่าน Web");
        return;
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = handleVideoSave;
      mediaRecorder.start(1000);
      
      requestWakeLock();

      recordBtn.classList.add('recording');
      statusText.innerText = "กำลังบันทึก...";
      timeDisplay.style.display = "inline";
      startTime = Date.now();
      recordInterval = setInterval(updateTimer, 1000);
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
      clearInterval(recordInterval);
      releaseWakeLock();

      recordBtn.classList.remove('recording');
      statusText.innerText = "ประมวลผลวิดีโอ...";
      timeDisplay.style.display = "none";
    }

    async function handleVideoSave() {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
      const file = new File([blob], `video_${Date.now()}.mp4`, { type: 'video/mp4' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'เซฟวิดีโอ' });
          statusText.innerText = "บันทึกสำเร็จ";
          return;
        } catch (e) {}
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `video_${Date.now()}.mp4`;
      a.click();
      statusText.innerText = "ดาวน์โหลดแล้ว";
    }

    function handleNativeVideo(input) {
      if (input.files && input.files[0]) {
        alert("บันทึกวิดีโอเรียบร้อยแล้ว!");
        statusText.innerText = "บันทึกวิดีโอสำเร็จ";
      }
    }

    function updateTimer() {
      const sec = Math.floor((Date.now() - startTime) / 1000);
      const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const secs = String(sec % 60).padStart(2, '0');
      timeDisplay.innerText = `${hrs}:${mins}:${secs}`;
    }

    function enableBlackScreen() { 
      blackOverlay.style.display = 'flex'; 
    }

    function disableBlackScreen() { 
      blackOverlay.style.display = 'none'; 
      resetOverlayHint();
    }

    // --- ระบบจับเวลาแตะหน้าจอค้างไว้ 3 วินาที ---
    function startHold(e) {
      if (e.type === 'touchstart') {
        e.preventDefault(); // ป้องกันการซูมหรือเลื่อนหน้าจอ
      }

      overlayHint.innerText = "กำลังปลดล็อก (ค้างไว้ 3 วิ)...";
      overlayHint.style.color = '#777'; // ข้อความสว่างขึ้นนิดหน่อยบอกว่ากำลังจับเวลา

      holdTimer = setTimeout(() => {
        disableBlackScreen();
      }, 3000); // 3000 มิลลิวินาที = 3 วินาที
    }

    function cancelHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      resetOverlayHint();
    }

    function resetOverlayHint() {
      overlayHint.innerText = "แตะหน้าจอค้างไว้ 3 วินาที เพื่อเปิดหน้าจอ";
      overlayHint.style.color = '#222';
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
