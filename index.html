<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Front Camera Long Video Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* กล่องพรีวิว */
    .preview-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* พรีวิวกล้องหน้าให้กลับด้านแบบกระจกเงา */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* แผงควบคุม */
    .controls {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .status-bar {
      display: flex;
      gap: 15px;
      font-size: 14px;
      color: #aaa;
    }

    .recording-time {
      color: #ff3b30;
      font-weight: bold;
      display: none;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
      align-items: center;
    }

    button, .native-btn {
      background: #2c2c2e;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:active, .native-btn:active {
      opacity: 0.7;
    }

    /* ปุ่มอัดหลัก */
    #recordBtn {
      background: #ff3b30;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      padding: 0;
      border: 4px solid #fff;
    }

    #recordBtn.recording {
      background: #fff;
      border-color: #ff3b30;
    }

    #recordBtn.recording::after {
      content: "";
      width: 22px;
      height: 22px;
      background: #ff3b30;
      border-radius: 4px;
    }

    #nativeFileInput {
      display: none;
    }

    .legacy-notice {
      background: #332200;
      color: #ffcc00;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 5px;
      display: none;
    }

    /* Overlay จอมืดสนิท */
    #blackScreenOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .overlay-hint {
      color: #222; /* สีมืดสลัว */
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      transition: color 0.3s;
    }
  </style>
</head>
<body>

  <div class="preview-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <div id="legacyNotice" class="legacy-notice">
      ⚠️ โหมด iOS 12 / เครื่องรุ่นเก่า: ใช้ปุ่มถ่ายด้วยกล้องระบบ
    </div>

    <div class="status-bar">
      <span id="statusText">กำลังเตรียมกล้องหน้า...</span>
      <span id="timeDisplay" class="recording-time">00:00:00</span>
    </div>

    <div class="btn-group">
      <!-- ปุ่มอัดหลัก (สำหรับเบราว์เซอร์ปกติ) -->
      <button id="recordBtn" onclick="toggleRecording()"></button>

      <!-- ปุ่มถ่ายด้วยกล้องหน้าของระบบ (สำหรับ iOS 12 / เครื่องรุ่นเก่า) -->
      <label for="nativeFileInput" id="nativeRecordBtn" class="native-btn" style="display: none; background: #007aff;">
        📷 ถ่ายวิดีโอ (กล้องหน้า)
      </label>
      <input type="file" id="nativeFileInput" accept="video/*" capture="user" onchange="handleNativeVideo(this)">

      <!-- ปุ่มดับจอ -->
      <button onclick="enableBlackScreen()" style="background: #1c1c1e; border: 1px solid #444;">
        🌙 ดับจอ
      </button>
    </div>
  </div>

  <!-- หน้าจอมืดสนิท (แตะค้าง 3 วิเพื่อปลดล็อก) -->
  <div id="blackScreenOverlay" 
       ontouchstart="startHold(event)" 
       ontouchend="cancelHold()" 
       ontouchcancel="cancelHold()" 
       onmousedown="startHold(event)" 
       onmouseup="cancelHold()" 
       onmouseleave="cancelHold()">
    <div class="overlay-hint" id="overlayHint">แตะหน้าจอค้างไว้ 3 วินาที เพื่อเปิดหน้าจอ</div>
  </div>

  <script>
    let currentStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordInterval = null;
    let startTime = 0;
    let wakeLock = null;
    let holdTimer = null;

    const webcam = document.getElementById('webcam');
    const recordBtn = document.getElementById('recordBtn');
    const nativeRecordBtn = document.getElementById('nativeRecordBtn');
    const legacyNotice = document.getElementById('legacyNotice');
    const statusText = document.getElementById('statusText');
    const timeDisplay = document.getElementById('timeDisplay');
    const blackOverlay = document.getElementById('blackScreenOverlay');
    const overlayHint = document.getElementById('overlayHint');

    const isMediaRecorderSupported = !!(window.MediaRecorder);

    async function initApp() {
      if (!isMediaRecorderSupported) {
        statusText.innerText = "โหมดกล้องหน้า (iOS 12)";
        legacyNotice.style.display = "block";
        recordBtn.style.display = "none";
        nativeRecordBtn.style.display = "inline-flex";
      } else {
        statusText.innerText = "กล้องหน้าพร้อมใช้งาน";
      }
      await startFrontCamera();
    }

    // 1. เรียกใช้งานกล้องหน้าเท่านั้น (facingMode: "user")
    async function startFrontCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusText.innerText = "เบราว์เซอร์ไม่รองรับการเปิดกล้อง";
        return;
      }

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: "user", // ล็อกกล้องหน้า
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: true
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcam.srcObject = currentStream;
      } catch (err) {
        // Fallback หากเปิดพร้อมความละเอียดสูงหรือเสียงไม่ได้
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
          webcam.srcObject = currentStream;
        } catch (e) {
          statusText.innerText = "ไม่สามารถเปิดกล้องหน้าได้";
        }
      }
    }

    // 2. ระบบอัดวิดีโอ
    function toggleRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      if (!currentStream) return;
      recordedChunks = [];
      
      try {
        mediaRecorder = new MediaRecorder(currentStream);
      } catch (e) {
        alert("เครื่องนี้ไม่รองรับการบันทึกวิดีโอผ่าน Web");
        return;
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = handleVideoSave;
      mediaRecorder.start(1000);
      
      requestWakeLock();

      recordBtn.classList.add('recording');
      statusText.innerText = "กำลังบันทึก (กล้องหน้า)...";
      timeDisplay.style.display = "inline";
      startTime = Date.now();
      recordInterval = setInterval(updateTimer, 1000);
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
      clearInterval(recordInterval);
      releaseWakeLock();

      recordBtn.classList.remove('recording');
      statusText.innerText = "ประมวลผลวิดีโอ...";
      timeDisplay.style.display = "none";
    }

    // 3. เซฟไฟล์ลงเครื่อง / เซฟลง Photos
    async function handleVideoSave() {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
      const file = new File([blob], `front_video_${Date.now()}.mp4`, { type: 'video/mp4' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'เซฟวิดีโอจากกล้องหน้า' });
          statusText.innerText = "บันทึกสำเร็จ";
          return;
        } catch (e) {}
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `front_video_${Date.now()}.mp4`;
      a.click();
      statusText.innerText = "ดาวน์โหลดแล้ว";
    }

    function handleNativeVideo(input) {
      if (input.files && input.files[0]) {
        alert("บันทึกวิดีโอกล้องหน้าเรียบร้อยแล้ว!");
        statusText.innerText = "บันทึกวิดีโอสำเร็จ";
      }
    }

    function updateTimer() {
      const sec = Math.floor((Date.now() - startTime) / 1000);
      const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const secs = String(sec % 60).padStart(2, '0');
      timeDisplay.innerText = `${hrs}:${mins}:${secs}`;
    }

    // 4. โหมดจอมืดสนิท & ระบบแตะค้าง 3 วินาที
    function enableBlackScreen() { 
      blackOverlay.style.display = 'flex'; 
    }

    function disableBlackScreen() { 
      blackOverlay.style.display = 'none'; 
      resetOverlayHint();
    }

    function startHold(e) {
      if (e.type === 'touchstart') {
        e.preventDefault();
      }

      overlayHint.innerText = "กำลังปลดล็อก (ค้างไว้ 3 วิ)...";
      overlayHint.style.color = '#777';

      holdTimer = setTimeout(() => {
        disableBlackScreen();
      }, 3000);
    }

    function cancelHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      resetOverlayHint();
    }

    function resetOverlayHint() {
      overlayHint.innerText = "แตะหน้าจอค้างไว้ 3 วินาที เพื่อเปิดหน้าจอ";
      overlayHint.style.color = '#222';
    }

    // 5. ป้องกันเครื่อง Sleep
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
